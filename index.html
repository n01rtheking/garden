<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b1a">
<title>Для тебя</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#070b1a;color:#f3ecff;
    font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;
    touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  .layer{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  #sky{background:linear-gradient(#05081a 0%,#0c1130 40%,#1a1d48 60%,#2b2452 74%)}
  #aurora{background:linear-gradient(#41204f 0%,#7e3570 36%,#c95c88 60%,#f3a2b4 76%);opacity:0;transition:opacity 3s}
  .star{position:absolute;border-radius:50%;background:#fff;animation:twinkle 3.5s ease-in-out infinite alternate}
  @keyframes twinkle{from{opacity:.1}to{opacity:.85}}
  #moon{position:fixed;top:8%;right:12%;width:42px;height:42px;border-radius:50%;pointer-events:none;transition:opacity 3s;
    background:radial-gradient(circle at 38% 38%,#fffaf2,#ebe5ff 60%,#cdc4f4);
    box-shadow:0 0 36px 10px rgba(220,210,255,.22),0 0 120px 40px rgba(150,130,255,.1)}
  #grain{opacity:.08;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  #vignette{background:radial-gradient(120% 95% at 50% 42%,transparent 55%,rgba(2,3,10,.7))}

  .stem{fill:none;stroke:#3d7a72;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;
    animation:grow 1.4s var(--d,0s) cubic-bezier(.4,0,.2,1) forwards}
  @keyframes grow{to{stroke-dashoffset:0}}
  .blade{fill:none;stroke:#3b5a52;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;
    animation:grow .9s calc(var(--d,0s) + .2s) ease-out forwards}
  .leaf{fill:#2d6158;opacity:0;animation:fade .7s calc(var(--d,0s) + .6s) forwards}
  .pool{opacity:0;animation:fade 2s calc(var(--d,0s) + 1.2s) forwards}
  @keyframes fade{to{opacity:1}}
  .bloom{transform-box:fill-box;transform-origin:center;transform:scale(0);
    animation:open 1.1s calc(var(--d,0s) + 1.2s) cubic-bezier(.3,1.5,.5,1) forwards}
  @keyframes open{to{transform:scale(1)}}
  .halo{animation:pulse 4s ease-in-out infinite alternate}
  @keyframes pulse{from{opacity:.55}to{opacity:1}}
  .flower{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite alternate}
  @keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}

  .text{position:fixed;left:16px;right:16px;text-align:center;pointer-events:none;
    text-shadow:0 0 18px rgba(200,170,255,.55),0 0 2px rgba(255,255,255,.4)}
  #intro{top:36%}
  #intro p{margin:0;opacity:0;animation:rise 2s forwards}
  #intro .l1{font-size:clamp(30px,7.5vw,46px);font-weight:500;animation-delay:.6s}
  #intro .l2{margin-top:14px;font-size:clamp(19px,4.6vw,24px);animation:rise 2s 2.4s forwards,breathe 3s 4.4s ease-in-out infinite alternate}
  #intro.gone{transition:opacity 1.2s;opacity:0}
  @keyframes rise{from{opacity:0;filter:blur(8px);transform:translateY(8px)}to{opacity:1;filter:none;transform:none}}
  @keyframes breathe{from{opacity:1}to{opacity:.45}}
  .caption{top:21%;font-size:clamp(28px,7vw,46px);font-weight:500;line-height:1.15;animation:say 5s 1s both}
  @keyframes say{0%{opacity:0;filter:blur(10px);transform:translateY(10px)}15%,78%{opacity:1;filter:none;transform:none}100%{opacity:0;filter:blur(6px)}}
  #line2{font-size:clamp(21px,5.4vw,32px);font-weight:500;opacity:0}
  #line2.on{animation:rise 2.6s forwards}
  #again{bottom:6%;font-size:18px;opacity:0}
  #again.on{animation:rise 2s forwards,breathe 3s 2s ease-in-out infinite alternate}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  #snd{position:fixed;top:max(14px,env(safe-area-inset-top));left:14px;width:40px;height:40px;border-radius:50%;
    border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#e9e2ff;display:grid;place-items:center;
    cursor:pointer;opacity:.7;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  #snd:focus-visible{outline:2px solid #b9a1ff;outline-offset:2px}
  #snd .off{display:none}
  #snd[aria-pressed="true"] .on{display:none}
  #snd[aria-pressed="true"] .off{display:block}

  @media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
<div id="sky" class="layer"></div>
<div id="aurora" class="layer"></div>
<div id="moon"></div>
<svg id="scene" class="layer" aria-hidden="true"><defs></defs></svg>
<canvas id="fx" class="layer" aria-hidden="true"></canvas>
<div id="grain" class="layer"></div>
<div id="vignette" class="layer"></div>

<div id="intro" class="text"><p class="l1">этот сад для тебя</p><p class="l2">коснись земли</p></div>
<div id="line2" class="text"></div>
<div id="again" class="text">можно сажать ещё</div>
<div id="said" class="sr" role="status"></div>

<button id="snd" type="button" aria-label="Выключить звук" aria-pressed="false">
  <svg class="on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
  <svg class="off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
</button>

<script>
// ===== Твой текст =====
// По одной вещи, которую ты в ней любишь. Сколько строк, столько цветов с подписью.
const PHRASES = [
  'твой смех',
  'твоё «спокойной ночи»',
  'что с тобой можно просто молчать',
  'как ты злишься. даже это мило',
  'что ты помнишь мелочи, которые я сказал вскользь',
  'искрометная',
  'твой голос',
  'что рядом с тобой спокойно',
  'тебя. просто всю',
];
const FINAL_BIG = 'Это всё ты.';
const FINAL_SMALL = 'И этот сад я бы сажал снова и снова.';
// ======================

const NS = 'http://www.w3.org/2000/svg';
const PALETTE = [
  { c: '#ff8fb6', rgb: '255,143,182' }, { c: '#ffb8d2', rgb: '255,184,210' },
  { c: '#ff6f9f', rgb: '255,111,159' }, { c: '#d6a8ff', rgb: '214,168,255' },
  { c: '#ffc6a8', rgb: '255,198,168' }, { c: '#fff0f6', rgb: '255,240,246' },
];
// мелодия по цветам (соль-мажорная пентатоника), дальше случайные ноты из неё
const MELODY = [587.33, 659.25, 783.99, 659.25, 880, 783.99, 987.77, 1174.66, 783.99];
const SCALE = [392, 440, 493.88, 587.33, 659.25, 783.99, 880, 987.77];
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const $ = id => document.getElementById(id);
const scene = $('scene'), defs = scene.querySelector('defs'), fx = $('fx'), ctx = fx.getContext('2d');
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
let W, H, HZ, n = 0, done = false, lastCaption = -1e9;
const blooms = [], roots = [], flies = [], sparks = [];
let textPts = null;

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

// ---------- сцена ----------
PALETTE.forEach((p, i) => {
  const pg = el('radialGradient', { id: 'p' + i, cx: '50%', cy: '100%', r: '100%' }, defs);
  el('stop', { offset: '0', 'stop-color': '#fff' }, pg);
  el('stop', { offset: '.5', 'stop-color': p.c }, pg);
  el('stop', { offset: '1', 'stop-color': p.c, 'stop-opacity': '.75' }, pg);
  const gg = el('radialGradient', { id: 'g' + i }, defs);
  el('stop', { offset: '0', 'stop-color': p.c, 'stop-opacity': '.65' }, gg);
  el('stop', { offset: '.35', 'stop-color': p.c, 'stop-opacity': '.22' }, gg);
  el('stop', { offset: '1', 'stop-color': p.c, 'stop-opacity': '0' }, gg);
});

for (let i = 0; i < 80; i++) {
  const s = document.createElement('div'), r = rnd(1, 2.2);
  s.className = 'star';
  s.style.cssText = `left:${rnd(0, 100)}%;top:${rnd(0, 58)}%;width:${r}px;height:${r}px;animation-delay:${-rnd(0, 3.5)}s`;
  $('sky').appendChild(s);
}

const hills = [
  { fill: '#2a1a48', dy: -30, amp: 34 },
  { fill: '#1f1238', dy: 10, amp: 26 },
  { fill: '#150c28', dy: 55, amp: 18 },
].map(h => Object.assign(el('path', { fill: h.fill, 'data-y': -1 }, scene), h));

function layout() {
  W = innerWidth; H = innerHeight; HZ = H * 0.6;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  fx.width = W * dpr; fx.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  for (const h of hills) {
    const y = HZ + h.dy, a = h.amp;
    h.setAttribute('d', `M0 ${y} C${W * .2} ${y - a} ${W * .38} ${y + a * .4} ${W * .6} ${y - a * .6} S${W * .9} ${y + a * .3} ${W} ${y - a * .2} V${H} H0Z`);
  }
}
layout();
addEventListener('resize', layout);

for (let i = 0; i < 34; i++) flies.push({ x: rnd(0, W), y: rnd(H * .35, H), ph: rnd(0, 7), sp: rnd(.6, 1.4), r: rnd(.8, 1.8) });

// ---------- звук ----------
let AC = null, master = null, muted = false;
function initAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = .14;
    const delay = AC.createDelay(), fb = AC.createGain(), lp = AC.createBiquadFilter();
    delay.delayTime.value = .33; fb.gain.value = .38; lp.frequency.value = 1800;
    master.connect(AC.destination); master.connect(delay); delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(AC.destination);
  } catch (e) { AC = null; } // без звука тоже работает
}
function note(freq, when = 0, vol = 1) {
  if (!AC || muted) return;
  const t = AC.currentTime + when, g = AC.createGain(), g2 = AC.createGain();
  const o = AC.createOscillator(), o2 = AC.createOscillator();
  o.type = 'sine'; o2.type = 'triangle'; o.frequency.value = freq; o2.frequency.value = freq * 2; g2.gain.value = .12;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.5 * vol, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + 2.8);
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
  o.start(t); o2.start(t); o.stop(t + 2.9); o2.stop(t + 2.9);
}
$('snd').addEventListener('pointerdown', e => e.stopPropagation());
$('snd').addEventListener('click', () => {
  muted = !muted;
  $('snd').setAttribute('aria-pressed', muted);
  $('snd').setAttribute('aria-label', muted ? 'Включить звук' : 'Выключить звук');
});

// ---------- цветы ----------
// Сажает цветок с корнем в (x, y); возвращает экранную точку бутона.
function plant(x, y, delay = 0, freq = null) {
  y = Math.max(y, HZ + 40);
  const depth = (y - HZ) / (H - HZ);
  const s = 0.45 + 0.8 * depth;               // ближе к зрителю = крупнее
  const h = rnd(80, 160), bend = rnd(-22, 22), pi = Math.floor(rnd(0, PALETTE.length));

  const pos = el('g', { transform: `translate(${x} ${y}) scale(${s})`, 'data-y': y });
  pos.style.setProperty('--d', delay + 's');
  scene.insertBefore(pos, [...scene.children].find(c => +c.dataset.y > y) || null);

  el('ellipse', { class: 'pool', rx: 46, ry: 9, fill: `url(#g${pi})` }, pos);
  for (let i = 0; i < 4; i++) {
    const bx = rnd(-14, 14), bh = rnd(8, 18);
    el('path', { class: 'blade', pathLength: 1, d: `M${bx} 2 q${rnd(-4, 4)} ${-bh / 2} ${rnd(-6, 6)} ${-bh}` }, pos);
  }

  const f = el('g', { class: 'flower' }, pos);
  f.style.animationDelay = -rnd(0, 5) + 's';
  el('path', { d: `M0 0 Q${bend} ${-h / 2} ${bend / 2} ${-h}`, pathLength: 1, class: 'stem' }, f);
  for (const side of [-1, 1]) {
    el('path', { d: 'M0 0 q10 -13 24 -5 q-11 11 -24 5z', class: 'leaf',
      transform: `translate(${bend * (side < 0 ? .3 : .42)} ${-h * (side < 0 ? .32 : .5)}) rotate(${side < 0 ? 200 : -22}) scale(${rnd(.7, 1)})` }, f);
  }

  const b = el('g', { class: 'bloom' }, el('g', { transform: `translate(${bend / 2} ${-h})` }, f));
  el('circle', { class: 'halo', r: 38, fill: `url(#g${pi})` }, b);
  const type = pick(['daisy', 'round', 'tulip']), fill = `url(#p${pi})`;
  if (type === 'daisy') {
    for (let i = 0; i < 12; i++) el('ellipse', { cx: 0, cy: -10, rx: 3.2, ry: 10, fill, transform: `rotate(${30 * i})` }, b);
  } else if (type === 'round') {
    const k = pick([5, 6]);
    for (let i = 0; i < k; i++) el('ellipse', { cx: 0, cy: -10, rx: 7.5, ry: 11, fill, transform: `rotate(${360 / k * i})` }, b);
  } else {
    for (const a of [-30, 30, 0]) el('ellipse', { cx: 0, cy: -9, rx: 7, ry: 13, fill, transform: `rotate(${a})` }, b);
  }
  el('circle', { r: type === 'tulip' ? 0 : 4, fill: '#fff4d6' }, b);

  roots.push({ x, y, delay });
  const top = { x: x + (bend / 2) * s, y: y - h * s, rgb: PALETTE[pi].rgb };
  blooms.push(top);
  setTimeout(() => {
    for (let i = 0; i < 16; i++) {
      const a = rnd(0, 6.28), v = rnd(.4, 1.8) * s;
      sparks.push({ x: top.x, y: top.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - .4, life: 70, max: 70, rgb: top.rgb });
    }
    note(freq || pick(SCALE), 0, .9);
  }, (delay + 1.25) * 1000);
  if (navigator.vibrate) navigator.vibrate(8);
  return top;
}

// ---------- искры, светлячки, финальный текст ----------
function glow(x, y, r, rgb, a) {
  ctx.fillStyle = `rgba(${rgb},${a * .14})`; ctx.beginPath(); ctx.arc(x, y, r * 4, 0, 6.283); ctx.fill();
  ctx.fillStyle = `rgba(${rgb},${a})`; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
}
function frame() {
  ctx.clearRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  for (const f of flies) {
    f.ph += .012 * f.sp;
    f.x += Math.cos(f.ph * .7) * .3; f.y += Math.sin(f.ph) * .22 - .06 * f.sp;
    if (f.y < H * .3) { f.y = H + 10; f.x = rnd(0, W); }
    if (f.x < -10) f.x = W + 10; else if (f.x > W + 10) f.x = -10;
    glow(f.x, f.y, f.r, '255,226,150', .3 + .3 * Math.sin(f.ph * 3));
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.x += s.vx; s.y += s.vy; s.vx *= .97; s.vy = s.vy * .97 - .006;
    if (--s.life <= 0) { sparks.splice(i, 1); continue; }
    glow(s.x, s.y, 1.3, s.rgb, s.life / s.max);
  }
  if (textPts) {
    const t = performance.now() / 1000;
    for (const p of textPts) {
      if (p.wait > 0) { p.wait--; continue; }
      p.x += (p.tx - p.x) * .035; p.y += (p.ty - p.y) * .035;
      glow(p.x + Math.sin(t * 2 + p.ph) * .6, p.y + Math.cos(t * 1.7 + p.ph) * .6, p.r, p.rgb, .55 + .4 * Math.sin(t * 3 + p.ph));
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Точки, из которых состоит надпись: рисуем её на скрытом холсте и берём закрашенные пиксели.
function textTargets(str, cy) {
  const c = document.createElement('canvas'), g = c.getContext('2d');
  let size = Math.min(W * .16, 110);
  const font = () => `italic 600 ${size}px "Cormorant Garamond", Georgia, serif`;
  g.font = font();
  while (g.measureText(str).width > W - 40 && size > 20) { size -= 2; g.font = font(); }
  c.width = W; c.height = Math.ceil(size * 1.6);
  g.font = font(); g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fff';
  g.fillText(str, W / 2, c.height / 2);
  const d = g.getImageData(0, 0, c.width, c.height).data, pts = [], step = Math.max(2, Math.round(size / 34));
  for (let y = 0; y < c.height; y += step)
    for (let x = 0; x < c.width; x += step)
      if (d[(y * c.width + x) * 4 + 3] > 140) pts.push({ tx: x, ty: y - c.height / 2 + cy });
  return { pts, size };
}

// ---------- сюжет ----------
function caption(text) {
  document.querySelectorAll('.caption').forEach(o => o.remove());
  const c = document.createElement('div');
  c.className = 'text caption';
  c.textContent = text;
  c.addEventListener('animationend', () => c.remove());
  document.body.appendChild(c);
  $('said').textContent = text;
}

async function finale() {
  $('aurora').style.opacity = 1;
  $('moon').style.opacity = .25;
  // луг расползается от её цветов: каждый новый растёт рядом с уже выросшим и чуть позже него
  for (let i = 0; i < 32; i++) {
    const seed = roots[Math.floor(rnd(0, roots.length))], side = Math.random() < .5 ? -1 : 1;
    const x = Math.min(Math.max(seed.x + side * rnd(35, 110), 10), W - 10);
    const y = Math.min(Math.max(seed.y + rnd(-45, 45), HZ + 40), H - 10);
    plant(x, y, Math.min(seed.delay + rnd(.5, 1), 5), null);
  }
  [392, 493.88, 587.33, 783.99, 987.77, 1174.66].forEach((f, i) => note(f, 4.6 + i * .14, .8));

  try { await document.fonts.load('italic 600 80px "Cormorant Garamond"'); } catch (e) {}
  setTimeout(() => {
    const cy = H * .22, { pts, size } = textTargets(FINAL_BIG, cy);
    textPts = pts.map(p => {
      const from = pick(blooms);
      return { ...p, x: REDUCED ? p.tx : from.x + rnd(-8, 8), y: REDUCED ? p.ty : from.y + rnd(-8, 8),
        wait: REDUCED ? 0 : Math.floor(rnd(0, 90)), ph: rnd(0, 7), r: rnd(.6, 1.05),
        rgb: Math.random() < .7 ? '255,244,250' : from.rgb };
    });
    $('said').textContent = FINAL_BIG + ' ' + FINAL_SMALL;
    const l2 = $('line2');
    l2.textContent = FINAL_SMALL;
    l2.style.top = cy + size * .62 + 'px';
    setTimeout(() => l2.classList.add('on'), 3600);
    setTimeout(() => $('again').classList.add('on'), 9000);
  }, 5200);
}

addEventListener('pointerdown', e => {
  initAudio();
  if (AC && AC.state === 'suspended') AC.resume();
  $('intro').classList.add('gone');
  const now = performance.now();
  // новая подпись только когда прошлую успели прочитать: если тыкает быстро, фразы не теряются, а ждут следующего цветка
  const speak = !done && now - lastCaption > 4600;
  plant(e.clientX, e.clientY, 0, speak ? MELODY[n % MELODY.length] : null);
  if (!speak) return;
  lastCaption = now;
  caption(PHRASES[n]);
  n++;
  $('aurora').style.opacity = (n / PHRASES.length) * .85;
  $('moon').style.opacity = 1 - (n / PHRASES.length) * .6;
  if (n === PHRASES.length) { done = true; setTimeout(finale, 6000); }
});

// Самопроверка: открой с #demo в конце адреса, и сад вырастет сам.
if (location.hash === '#demo')
  PHRASES.forEach((_, i) => setTimeout(() => dispatchEvent(new PointerEvent('pointerdown',
    { clientX: rnd(40, W - 40), clientY: rnd(HZ + 40, H - 20) })), 1500 + i * 4800));
</script>
</body>
</html>
